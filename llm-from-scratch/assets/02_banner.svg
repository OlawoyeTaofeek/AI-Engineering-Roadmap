<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf5"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#2563eb" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="0" y="0" width="10" height="300" fill="url(#accent)"/>

  <!-- Eyebrow -->
  <text x="60" y="56" font-size="15" letter-spacing="4" fill="#2563eb" font-weight="700">MODULE 02 &#8226; STAGE 1 &#8226; LLM ARCHITECTURE</text>

  <!-- Title -->
  <text x="58" y="106" font-size="52" fill="#0f172a" font-weight="700" letter-spacing="-1">Tiny LLM</text>
  <text x="58" y="138" font-size="19" fill="#334155">GPT-2 (124M) &#8212; built token by token, from raw tensors to a talking model</text>

  <!-- Pipeline -->
  <g font-size="12.5" font-weight="600">
    <!-- connecting line -->
    <line x1="95" y1="228" x2="1112" y2="228" stroke="#93c5fd" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>

    <!-- DATA -->
    <g filter="url(#soft)">
      <rect x="55" y="200" width="118" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    </g>
    <text x="114" y="224" text-anchor="middle" fill="#1e40af">DATA</text>
    <text x="114" y="240" text-anchor="middle" fill="#64748b" font-size="10" font-weight="500">Dataset / Loader</text>

    <!-- TOKENIZER -->
    <g filter="url(#soft)">
      <rect x="215" y="200" width="130" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    </g>
    <text x="280" y="224" text-anchor="middle" fill="#1e40af">TOKENIZER</text>
    <text x="280" y="240" text-anchor="middle" fill="#64748b" font-size="10" font-weight="500">Byte &#183; Char &#183; Word &#183; BPE</text>

    <!-- ATTENTION -->
    <g filter="url(#soft)">
      <rect x="387" y="200" width="130" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    </g>
    <text x="452" y="224" text-anchor="middle" fill="#1e40af">ATTENTION</text>
    <text x="452" y="240" text-anchor="middle" fill="#64748b" font-size="10" font-weight="500">Self &#8594; Causal &#8594; MHA</text>

    <!-- TRANSFORMER BLOCK -->
    <g filter="url(#soft)">
      <rect x="559" y="200" width="150" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    </g>
    <text x="634" y="224" text-anchor="middle" fill="#1e40af">TRANSFORMER</text>
    <text x="634" y="240" text-anchor="middle" fill="#64748b" font-size="10" font-weight="500">Norm &#183; Attn &#183; FFN</text>

    <!-- GPT MODEL -->
    <g filter="url(#soft)">
      <rect x="751" y="200" width="130" height="56" rx="10" fill="#2563eb"/>
    </g>
    <text x="816" y="224" text-anchor="middle" fill="#ffffff">GPT MODEL</text>
    <text x="816" y="240" text-anchor="middle" fill="#dbeafe" font-size="10" font-weight="500">+ Pretrained GPT-2</text>

    <!-- DECODE -->
    <g filter="url(#soft)">
      <rect x="923" y="200" width="130" height="56" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    </g>
    <text x="988" y="224" text-anchor="middle" fill="#1e40af">DECODE</text>
    <text x="988" y="240" text-anchor="middle" fill="#64748b" font-size="10" font-weight="500">Sampling &#183; Beam Search</text>
  </g>

  <!-- right side badge -->
  <text x="1140" y="56" text-anchor="end" font-size="13" fill="#94a3b8" font-weight="600">PART 1 &#183; 15 MODULES</text>
</svg>
