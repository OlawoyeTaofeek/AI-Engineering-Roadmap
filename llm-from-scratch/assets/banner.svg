<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B1220"/>
    <stop offset="0.55" stop-color="#111C33"/>
    <stop offset="1" stop-color="#172554"/>
  </linearGradient>
  <linearGradient id="accent" x1="350" y1="80" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
    <stop stop-color="#60A5FA"/>
    <stop offset="0.5" stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
  </filter>
</defs>

<rect width="1600" height="420" rx="28" fill="url(#bg)"/>

<!-- subtle grid -->
<g opacity="0.12" stroke="#93C5FD">
  <path d="M0 70H1600M0 140H1600M0 210H1600M0 280H1600M0 350H1600"/>
  <path d="M100 0V420M250 0V420M400 0V420M550 0V420M700 0V420M850 0V420M1000 0V420M1150 0V420M1300 0V420M1450 0V420"/>
</g>

<!-- neural/attention motif -->
<g filter="url(#shadow)">
  <circle cx="1260" cy="105" r="13" fill="#60A5FA"/>
  <circle cx="1380" cy="175" r="13" fill="#38BDF8"/>
  <circle cx="1240" cy="235" r="13" fill="#A78BFA"/>
  <circle cx="1430" cy="295" r="13" fill="#60A5FA"/>
  <circle cx="1320" cy="340" r="13" fill="#38BDF8"/>
  <path d="M1260 105L1380 175L1240 235L1430 295L1320 340M1260 105L1240 235M1380 175L1430 295M1240 235L1320 340" stroke="url(#accent)" stroke-width="3" opacity="0.8"/>
</g>

<!-- central transformer block -->
<g transform="translate(1010 65)" filter="url(#shadow)">
  <rect width="270" height="270" rx="24" fill="#0F172A" stroke="#60A5FA" stroke-width="2"/>
  <rect x="35" y="35" width="200" height="38" rx="10" fill="#1E3A8A"/>
  <rect x="35" y="88" width="200" height="38" rx="10" fill="#1D4ED8"/>
  <rect x="35" y="141" width="200" height="38" rx="10" fill="#2563EB"/>
  <rect x="35" y="194" width="200" height="38" rx="10" fill="#3730A3"/>
  <text x="135" y="60" text-anchor="middle" fill="#DBEAFE" font-family="Arial, sans-serif" font-size="17" font-weight="700">ATTENTION</text>
  <text x="135" y="113" text-anchor="middle" fill="#EFF6FF" font-family="Arial, sans-serif" font-size="17" font-weight="700">TRANSFORMER</text>
  <text x="135" y="166" text-anchor="middle" fill="#EFF6FF" font-family="Arial, sans-serif" font-size="17" font-weight="700">TRAINING</text>
  <text x="135" y="219" text-anchor="middle" fill="#EDE9FE" font-family="Arial, sans-serif" font-size="17" font-weight="700">SERVING</text>
</g>

<!-- title -->
<text x="90" y="150" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">LLM From Scratch</text>
<rect x="94" y="174" width="520" height="5" rx="2.5" fill="url(#accent)"/>
<text x="92" y="225" fill="#BFDBFE" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600">Foundations → Training → Alignment → Serving</text>
<text x="92" y="274" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="19">A free, implementation-first roadmap for understanding</text>
<text x="92" y="304" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="19">modern language models from the inside out.</text>

<g transform="translate(92 337)">
  <rect width="142" height="38" rx="19" fill="#1E3A8A"/>
  <text x="71" y="25" text-anchor="middle" fill="#DBEAFE" font-family="Arial, sans-serif" font-size="14" font-weight="700">FROM FIRST PRINCIPLES</text>
</g>
<g transform="translate(246 337)">
  <rect width="122" height="38" rx="19" fill="#164E63"/>
  <text x="61" y="25" text-anchor="middle" fill="#CFFAFE" font-family="Arial, sans-serif" font-size="14" font-weight="700">OPEN RESOURCE</text>
</g>
<g transform="translate(380 337)">
  <rect width="118" height="38" rx="19" fill="#312E81"/>
  <text x="59" y="25" text-anchor="middle" fill="#E0E7FF" font-family="Arial, sans-serif" font-size="14" font-weight="700">PYTORCH</text>
</g>
</svg>