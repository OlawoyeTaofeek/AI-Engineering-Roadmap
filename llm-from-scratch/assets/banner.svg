<svg viewBox="0 0 1400 320" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Fira Code', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101b30"/>
    </linearGradient>
    <linearGradient id="titleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#c7d8f5"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#3b82f6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1400" height="320" fill="url(#bg)"/>
  <rect width="1400" height="320" fill="url(#grid)"/>
  <line x1="820" y1="0" x2="820" y2="320" stroke="#1e293b" stroke-width="1"/>

  <!-- ============ LEFT: title block ============ -->
  <text x="60" y="120" font-size="54" font-weight="700" fill="url(#titleFade)" letter-spacing="-1">LLM From Scratch</text>
  <text x="60" y="156" font-size="17" fill="#7b93b8">Tensors and autograd, up through a trained, quantized,</text>
  <text x="60" y="180" font-size="17" fill="#7b93b8">RLHF-aligned model — served behind a real API.</text>

  <!-- stage tracker -->
  <g transform="translate(60,232)">
    <line x1="0" y1="0" x2="690" y2="0" stroke="#28374f" stroke-width="2"/>
    <g font-size="11" fill="#8ea2c0">
      <!-- 8 stage nodes -->
      <g transform="translate(0,0)">
        <circle r="7" fill="#0b1220" stroke="#3b82f6" stroke-width="2"/>
        <text x="0" y="26" text-anchor="middle">Arch</text>
      </g>
      <g transform="translate(98,0)">
        <circle r="7" fill="#0b1220" stroke="#3b82f6" stroke-width="2"/>
        <text x="0" y="26" text-anchor="middle">Pretrain</text>
      </g>
      <g transform="translate(196,0)">
        <circle r="7" fill="#0b1220" stroke="#4c8bf5" stroke-width="2"/>
        <text x="0" y="26" text-anchor="middle">Data</text>
      </g>
      <g transform="translate(294,0)">
        <circle r="7" fill="#0b1220" stroke="#4c8bf5" stroke-width="2"/>
        <text x="0" y="26" text-anchor="middle">SFT</text>
      </g>
      <g transform="translate(392,0)">
        <circle r="7" fill="#0b1220" stroke="#60a5fa" stroke-width="2"/>
        <text x="0" y="26" text-anchor="middle">Align</text>
      </g>
      <g transform="translate(490,0)">
        <circle r="7" fill="#0b1220" stroke="#60a5fa" stroke-width="2"/>
        <text x="0" y="26" text-anchor="middle">Eval</text>
      </g>
      <g transform="translate(588,0)">
        <circle r="7" fill="#0b1220" stroke="#93c5fd" stroke-width="2"/>
        <text x="0" y="26" text-anchor="middle">Serve</text>
      </g>
      <g transform="translate(686,0)">
        <circle r="8" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
        <text x="0" y="26" text-anchor="middle" fill="#c7d8f5">Ship</text>
      </g>
    </g>
  </g>

  <!-- ============ RIGHT: transformer block schematic ============ -->
  <g transform="translate(870,26)">
    <text x="0" y="-6" font-size="12" fill="#5f7ba0">// one transformer block, built by hand</text>

    <!-- N-layers bracket -->
    <path d="M 470 20 Q 486 20 486 36 L 486 190 Q 486 206 470 206" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="500" y="118" font-size="13" fill="#8ea2c0" transform="rotate(90,500,118)">× N layers</text>

    <!-- Output -->
    <rect x="0" y="0" width="440" height="34" rx="6" fill="#16213a" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="220" y="22" font-size="14" fill="#e2e8f0" text-anchor="middle">Output projection (LM head)</text>
    <line x1="220" y1="34" x2="220" y2="50" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Add & Norm 2 -->
    <rect x="60" y="52" width="320" height="30" rx="15" fill="#111c33" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="220" y="72" font-size="13" fill="#a9bcd8" text-anchor="middle">Add &amp; norm</text>
    <line x1="220" y1="82" x2="220" y2="98" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- FFN -->
    <rect x="20" y="100" width="400" height="34" rx="6" fill="#16213a" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="220" y="122" font-size="14" fill="#e2e8f0" text-anchor="middle">Feed forward (SwiGLU)</text>
    <line x1="220" y1="134" x2="220" y2="150" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Add & Norm 1 -->
    <rect x="60" y="152" width="320" height="30" rx="15" fill="#111c33" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="220" y="172" font-size="13" fill="#a9bcd8" text-anchor="middle">Add &amp; norm</text>
    <line x1="220" y1="182" x2="220" y2="198" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Attention -->
    <rect x="0" y="200" width="440" height="34" rx="6" fill="#16213a" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="220" y="222" font-size="14" fill="#e2e8f0" text-anchor="middle">Multi-head attention (RoPE, GQA)</text>

    <!-- residual loops -->
    <path d="M 5 234 C -26 234 -26 88 5 82" fill="none" stroke="#3b5a86" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 5 234 C -50 234 -50 182 5 182" fill="none" stroke="#3b5a86" stroke-width="1.5" stroke-dasharray="4 3" opacity="0"/>

    <line x1="220" y1="234" x2="220" y2="250" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Input embedding -->
    <rect x="30" y="252" width="380" height="34" rx="6" fill="#16213a" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="220" y="274" font-size="14" fill="#e2e8f0" text-anchor="middle">Token + positional embedding</text>
  </g>
</svg>
